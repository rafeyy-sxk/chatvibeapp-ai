<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatVibe AI — Neural Flow Field Hero Background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0A0A;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
  }
  .label {
    position: fixed;
    bottom: 24px;
    left: 24px;
    font-family: 'DM Sans', monospace;
    font-size: 11px;
    color: rgba(232, 64, 37, 0.4);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="label">ChatVibe AI · Neural Flow Field · #E84025</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, t = 0;
const PARTICLE_COUNT = 200;
const particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

function initParticles() {
  particles.length = 0;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0, vy: 0,
      age: Math.floor(Math.random() * 400),
      size: 0.8 + Math.random() * 1.6,
    });
  }
}
initParticles();

// Approximated Perlin-like flow using layered sine waves
function flowAngle(x, y, time) {
  const s1 = Math.sin(x * 0.005 + time * 0.32) * 2.5;
  const s2 = Math.cos(y * 0.006 + time * 0.25) * 2.0;
  const s3 = Math.sin((x * 0.003 + y * 0.004) + time * 0.48) * Math.PI;
  const s4 = Math.cos(x * 0.008 - y * 0.003 + time * 0.18) * 1.2;
  return s1 + s2 + s3 + s4;
}

// Occasional bright "pulse" particles
function isHighEnergy(age) {
  return age % 127 < 8;
}

function draw() {
  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 10, 0.032)';
  ctx.fillRect(0, 0, W, H);

  const SPEED = 0.9;
  const FRICTION = 0.93;

  for (const p of particles) {
    const angle = flowAngle(p.x, p.y, t);
    p.vx = p.vx * FRICTION + Math.cos(angle) * SPEED * (1 - FRICTION);
    p.vy = p.vy * FRICTION + Math.sin(angle) * SPEED * (1 - FRICTION);
    p.x += p.vx;
    p.y += p.vy;
    p.age++;

    // Respawn out-of-bounds or aged-out particles
    if (p.x < -2 || p.x > W + 2 || p.y < -2 || p.y > H + 2 || p.age > 480) {
      p.x = Math.random() * W;
      p.y = Math.random() * H;
      p.vx = 0; p.vy = 0;
      p.age = 0;
      continue;
    }

    const lifeFade =
      Math.min(1, p.age / 60) * Math.max(0, 1 - (p.age - 420) / 60);

    const high = isHighEnergy(p.age);
    const alpha = high ? lifeFade * 0.28 : lifeFade * 0.055;
    const size  = high ? p.size * 2.5 : p.size;

    if (alpha < 0.002) continue;

    // Draw particle
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(232, 64, 37, ${alpha.toFixed(3)})`;
    ctx.fill();
  }

  // Subtle connecting lines between nearby particles
  if (t % 3 < 1) {
    for (let i = 0; i < particles.length; i += 3) {
      for (let j = i + 1; j < Math.min(i + 12, particles.length); j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 60) {
          const lineAlpha = (1 - dist / 60) * 0.015;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(232, 64, 37, ${lineAlpha.toFixed(4)})`;
          ctx.lineWidth = 0.5;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
  }

  t += 0.007;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
